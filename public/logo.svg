<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">API Gateway</title>
  <desc id="desc">Placeholder mark: one entry point fanning out to multiple upstreams.</desc>
  <!--
    中性占位标识，刻意不带任何品牌特征。

    这个文件有两个用途：
      1. index.html 里的静态 favicon —— JS 起来前浏览器唯一能显示的图标
      2. 六处 `siteLogo || '/logo.svg'` 的兜底图（登录页、落地页、模型广场、法律页等）

    两处都在「后台配置的 site_logo 还没拿到」时出现，所以它必须是无品牌的。
    上一版沿用了上游项目的 logo（渐变深蓝 + 交错 S），
    线上首屏会闪一下别家的牌子——这正是要避免的。

    形状取「一个入口扇出到多个上游」，与产品语义一致但不指向任何具体品牌；
    线宽取到 34（约 6.6% 画布），保证 16px favicon 下不糊成一团。
  -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="#334155"/>
  <g fill="none" stroke="#F8FAFC" stroke-width="34" stroke-linecap="round">
    <path d="M176 256 352 160"/>
    <path d="M176 256 352 352"/>
  </g>
  <g fill="#F8FAFC">
    <circle cx="176" cy="256" r="46"/>
    <circle cx="352" cy="160" r="36"/>
    <circle cx="352" cy="352" r="36"/>
  </g>
</svg>
