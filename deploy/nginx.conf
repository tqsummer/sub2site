# WebSocket 升级支持（管理端 ops QPS 监控需要）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream sub2api_backend {
    server sub2api:8080;
    keepalive 32;
}

# 反代到 sub2api 的公共头
# 注意 Host 传 $host（即 www.aiproxy.com），不是后端域名：
# sub2api 的 payment_resume_service.CanonicalizeReturnURL 用 c.Request.Host 做
# return_url 同源校验，传 $host 可直接匹配成功，无需依赖 Referer。
# sub2api 没有全局 Host 白名单中间件，这样传是安全的。

# ============ www.aiproxy.com —— 新用户端（sub2site） ============
server {
    listen 80;
    server_name www.aiproxy.com;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 32m;

    # ---- 管理 API 不对用户端开放 ----
    # 用户端前端已不再调用任何 /api/v1/admin/*，这里做纵深防御：
    # 即便拿到管理员 JWT，也无法从 www 域调用管理接口。管理端请走 api.aiproxy.com。
    # 用 ^~ 前缀匹配（优先级高于正则），返回 404 而非 403，不暴露路径存在性。
    location ^~ /api/v1/admin {
        return 404;
    }

    # ---- 后端 API（同源 BFF，规避 CORS / SameSite / Referer 三类跨域问题）----
    location /api/ {
        proxy_pass http://sub2api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    # ---- AI 网关（SSE 流式，必须关闭缓冲）----
    # sub2api 的网关是多个顶级路由组，不止 /v1：
    #   /v1            Claude(/messages) + OpenAI(/chat/completions,/responses) 兼容
    #   /v1beta        Gemini
    #   /antigravity/* Antigravity（v1 与 v1beta）
    #   /backend-api/codex  Codex 直连
    # 注意 v1beta 写在 v1 前面，避免分支歧义。
    location ~ ^/(v1beta|v1|antigravity|backend-api)(/|$) {
        proxy_pass http://sub2api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  600s;
        chunked_transfer_encoding on;
    }

    # ---- 安装向导状态（前端启动时会请求）----
    location /setup/ {
        proxy_pass http://sub2api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 静态资源：带内容哈希，长缓存 ----
    location /assets/ {
        # 单一 Cache-Control 头（不用 expires，避免与 add_header 重复下发）
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ---- SPA fallback ----
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

# ============ api.aiproxy.com —— sub2api 原生（含管理端）============
server {
    listen 80;
    server_name api.aiproxy.com;

    client_max_body_size 32m;

    location / {
        proxy_pass http://sub2api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_buffering     off;
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }
}

# ============ 兜底：未匹配的 Host 一律 444 ============
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
