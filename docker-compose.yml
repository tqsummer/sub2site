services:
  sub2site:
    build:
      context: .
      dockerfile: Dockerfile
    image: sub2site:latest
    container_name: sub2site
    restart: unless-stopped
    # 不暴露端口：由 edge-nginx 统一入口反代（与生产架构一致）。
    # 暴露了反而会绕过 edge 的管理接口拦截与 HTTPS 跳转。
    environment:
      # 注入到 index.html 的 <title>，让首次访问的用户第一帧就看到正确品牌
      # （静态托管没有后端渲染那一层，详见 deploy/nginx.conf.template）。
      # 应与后台设置里的 site_name 保持一致；改了要重启容器。
      SITE_NAME: "AiRouterX"
    networks:
      - sub2api-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # 复用 sub2api 已有的 compose 网络，容器名 sub2api 可直接解析
  sub2api-net:
    external: true
    name: sub2api-deploy_sub2api-network
