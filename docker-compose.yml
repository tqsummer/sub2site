services:
  sub2site:
    build:
      context: .
      dockerfile: Dockerfile
    image: sub2site:latest
    container_name: sub2site
    restart: unless-stopped
    # 不暴露端口：由 edge-nginx 统一入口反代（与生产架构一致）。
    # 暴露了反而会绕过 edge 的管理接口拦截与 HTTPS 跳转。
    networks:
      - sub2api-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # 复用 sub2api 已有的 compose 网络，容器名 sub2api 可直接解析
  sub2api-net:
    external: true
    name: sub2api-deploy_sub2api-network
